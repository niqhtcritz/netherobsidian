name: NetherKey
version: 1.0.0
main: me.netherkey.NetherKey
api-version: '1.21'
description: Custom glowing Nether Obsidian that unlocks the Nether.
commands:
  givenetherobsidian:
    description: Give the Nether Obsidian item
    usage: /givenetherobsidian [player]
    permission: netherkey.admin
  netherlock:
    description: Lock or unlock the Nether
    usage: /netherlock <lock|unlock|status>
    permission: netherkey.admin
permissions:
  netherkey.admin:
    description: Use NetherKey admin commands
    default: op
